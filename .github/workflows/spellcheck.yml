name: Spell check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "cspell.json"
      - ".github/workflows/spellcheck.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "cspell.json"
      - ".github/workflows/spellcheck.yml"

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  spellcheck:
    name: Spell check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      # related to postmanlabs/postman-code-generators#792
      - name: Uninstall yarn
        run: sudo rm -f $(which yarn)

      - name: Install dependencies
        run: pnpm install

      - name: Run spell check
        run: pnpm spellcheck
