name: Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # related to postmanlabs/postman-code-generators#792
      - name: Uninstall yarn
        run: sudo rm -f $(which yarn)

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Build website
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build

  deploy:
    name: Deploy
    runs-on: blacksmith-4vcpu-ubuntu-2604
    needs: build
    permissions:
      pages: write # required to deploy to GitHub Pages
      id-token: write # required to verify deployment source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  recrawl:
    name: Algolia recrawl
    runs-on: blacksmith-4vcpu-ubuntu-2604
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check for documentation changes
        id: docs-changed
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^docs/.*\.(md|mdx)$|^docusaurus\.config\.|^sidebars\.|^static/api/openapi\.json$|^src/openapi/'; then
            echo "docs_changed=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected - will trigger recrawl"
          else
            echo "docs_changed=false" >> $GITHUB_OUTPUT
            echo "No documentation changes - skipping recrawl"
          fi

      - name: Trigger Algolia Crawler reindex
        if: steps.docs-changed.outputs.docs_changed == 'true'
        env:
          CRAWLER_USER_ID: ${{ secrets.CRAWLER_USER_ID }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
          CRAWLER_ID: ${{ secrets.CRAWLER_ID }}
        run: |
          AUTH=$(printf '%s:%s' "${CRAWLER_USER_ID}" "${CRAWLER_API_KEY}" | base64 -w 0)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/reindex" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Algolia crawler reindex triggered successfully"
          else
            echo "Failed to trigger Algolia crawler reindex"
            exit 1
          fi
