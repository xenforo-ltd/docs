name: Lint

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # related to postmanlabs/postman-code-generators#792
      - name: Uninstall yarn
        run: sudo rm -f $(which yarn)

      - name: Set up pnpm and Node.js
        id: setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Run every check even if an earlier one fails
      - name: Check formatting
        run: pnpm lint:format

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:md

      - name: Spell check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:spell

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:types
