name: Test deployment

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  test-deploy:
    name: Test deployment
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # related to postmanlabs/postman-code-generators#792
      - name: Uninstall yarn
        run: sudo rm -f $(which yarn)

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Test build
        run: pnpm build
