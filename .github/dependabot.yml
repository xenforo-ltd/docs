version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    # typescript-eslint does not support TypeScript 7 yet, so hold TypeScript
    # at the current major until it does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    groups:
      npm:
        patterns:
          - "*"
